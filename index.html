<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- The logo's K: fetched while the page parses, so it doesn't flash in a fallback face first -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Kakaonut: bitcoin hidden in a photo</title>
    <meta name="description" content="Hide Cashu ecash in an ordinary-looking photo and send it to a friend. Everything runs in your browser." />
    <link rel="canonical" href="https://www.kakaonut.com/" />
    <!-- Link previews (KakaoTalk, iMessage, X, Slack…). The image is public/og.png, 1200 × 630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kakaonut" />
    <meta property="og:url" content="https://www.kakaonut.com/" />
    <meta property="og:title" content="Kakaonut 카카오넛" />
    <meta property="og:description" content="Bitcoin hidden in a photo. 사진 속에 숨긴 비트코인." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:image" content="https://www.kakaonut.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Send bitcoin in a photo. A photo of a Seoul palace with 20,000 sats inside." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
